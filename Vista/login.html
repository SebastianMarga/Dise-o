<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Py</title>
  <link rel="stylesheet" href="login.css"/>
  <link rel="shortcut icon" href="https://freesvg.org/img/1538298822.png" type="image/x-icon" />
</head>
<body>

  <!-- Header -->
   <nav>
        <h1>ChatBot Py</h1>
        <img src="https://freesvg.org/img/1538298822.png" alt="Logo Py">
    </nav>

  <!-- Selector -->
  <div class="selector">
    <button onclick="showSection('log')">Iniciar Sesión</button>
    <span>Ó</span>
    <button onclick="showSection('reg')">Registrarse</button>
  </div>

  <!-- Login -->
  <div id="login-div" class="form-container">
    <div class="form-box">
      <div class="logo">
        <img src="https://freesvg.org/img/1538298822.png" alt="logo" />
        <h2>Inicia Sesión</h2>
        <p>Adentrate con tu propia cuenta de Chatbot Py</p>
      </div>
      <form>
        <label>Correo electrónico:</label>
        <input type="email" placeholder="example@mail.com" required />

        <label>Contraseña:</label>
        <input type="password" placeholder="*******" required />

        <input type="button" style="background-color: #1976d2;" value="Iniciar sesión" />
      </form>
    </div>
  </div>

  <!-- Registro -->
  <div id="register-div" class="form-container" style="display: none;">
    <div class="form-box">
      <div class="logo">
        <img src="https://freesvg.org/img/1538298822.png" alt="logo" />
        <h2>Registro</h2>
        <p>Regístrate y guarda tu historial de textos</p>
      </div>
      <form>
        <h3 class="section-title red">Información Personal</h3>

        <label>Nombre:</label>
        <input type="text" required />

        <label>Apellidos:</label>
        <input type="text" required />

        <h3 class="section-title blue">Información de Cuenta</h3>

        <label>Correo electrónico:</label>
        <input type="email" required />

        <label>Contraseña:</label>
        <input type="password" required />

        <input type="button" style="background-color: #388e3c;" value="Registrar Cuenta" />
      </form>
    </div>
  </div>

  <script>
    function showSection(section) {
      document.getElementById('login-div').style.display = section === 'log' ? 'block' : 'none';
      document.getElementById('register-div').style.display = section === 'reg' ? 'block' : 'none';
    }
  </script>
</body>
</html>
